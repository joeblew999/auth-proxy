#:schema https://pitchfork.jdx.dev/schema.json

# Local daemons for grok-oauth-proxy. Commands stay mise tasks (SSOT);
# pitchfork only supervises: start, readiness, logs, stop.
#
#   mise run svc:start        build and start the proxy (real providers)
#   mise run svc:start --mock build and start proxy + mock upstream
#   mise run svc:status       what is running
#   mise run svc:logs         tail the logs
#   mise run svc:stop         stop everything this project started

[daemons.mock]
run = "mise run dev:mock-server"
port = 18080
ready_http = { url = "http://127.0.0.1:18080/v1/models", timeout = "15s" }

[daemons.proxy]
run = "mise run dev:serve"
port = 56121
ready_http = { url = "http://127.0.0.1:56121/health", timeout = "15s" }

[daemons.proxy-mock]
run = "mise run dev:serve-mock"
port = 56121
ready_http = { url = "http://127.0.0.1:56121/health", timeout = "15s" }
depends = ["mock"]
