name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write       # Upload the packslip bundle.
  id-token: write       # Sign the packslip with the workflow's identity.
  attestations: write   # Publish provenance for the matched files.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SSOT: every tool comes from mise.toml. No setup-go, no goreleaser
      # action; the release task runs the pinned goreleaser.
      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Run GoReleaser
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed manifest so mise installs this release with verification, and
      # ships the skill that matches the installed version.
      - name: Publish packslip
        uses: jdx/packslip@v1
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: grok-oauth-proxy
          resources: |
            skill/grok-oauth-proxy=repo:skills/grok-oauth-proxy
