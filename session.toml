# Where the repo's Claude Code skills come from. `mise run session:sync`
# writes them into .claude/skills; `mise run session:bump` moves a github
# pin to upstream HEAD. Nothing in cmd/dev/session names a skill or a pin.
#
# Two source kinds:
#   [source.<name>] with module + module_dir: skills read out of a Go module
#   in the local module cache, at the version module_dir's go.mod pins.
#   kind defaults to "gomod" when module is set.
#   [source.<name>] with repo + ref: skills extracted from a GitHub tarball
#   at a pinned commit. kind defaults to "github" when repo is set.
#
# gsx/gsxui need no source here: they ship skills in their packslip releases,
# and mise links them via [settings.skills] auto_sync.

# How this repo runs the session sync, quoted back by every error a sync would fix.
sync_command = "mise run session:sync"

[source.cloudflare]
repo = "cloudflare/skills"
# No tags or releases upstream, so this is a commit. Move it with bump.
ref = "b052c32bab7dd493513260228a36c88294f343f1"
skills = ["wrangler", "durable-objects", "workers-best-practices", "cloudflare"]

# The rest of the Claude Code session, generated into .claude/settings.json by
# `mise run session:sync`. Named here and nowhere else, for the same reason
# the pins above are: two places to look is how the copies drifted.
[claude]
# Marketplace plugins that must not load in this repo. Each of these ships a
# skill that shadows one pinned above, at a version nothing here controls.
blocked_plugins = [
  "cloudflare@cloudflare",
  "claude-code@claude-skills",
  "mise@cc-skills",
  "itp@cc-skills",
]
# claude.ai connectors are per-developer and invisible to a fresh clone, so the
# repo declares its own servers in .mcp.json instead.
claude_ai_connectors = false
# ...and approves them wholesale, so .mcp.json stays the only place a server is
# named.
approve_mcp_servers = true
