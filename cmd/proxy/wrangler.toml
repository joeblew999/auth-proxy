name = "grok-oauth-proxy"
main = "build/go/worker.mjs"
compatibility_date = "2026-09-07"
# No account_id: wrangler takes CLOUDFLARE_ACCOUNT_ID from the environment,
# which fnox provides, so this file is the same for every developer.
workers_dev = true
compatibility_flags = [
  "streams_enable_constructors",
]
# Holds the Grok login for providers with auth = "xai-oauth". No id: wrangler
# provisions the namespace on an account's first deploy and keeps it linked
# after. It also writes the id back into the config it deployed from, which is
# why `mise run deploy` runs wrangler on a throwaway copy of this file.
kv_namespaces = [
  { binding = "GROK_AUTH" },
]

# Providers come from providers.toml, built into the Worker; secrets are pushed
# with `mise run keys:push`. Nothing provider-specific belongs in this file.

# Optional: route upstream traffic through a Cloudflare Tunnel instead of the
# Worker's own fetch.
# vpc_networks = [
#   { binding = "GROK_EGRESS", tunnel_id = "<YOUR_TUNNEL_ID>", remote = true },
# ]

[build]
command = "mise run proxy:wasm"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# The same Worker built with TinyGo (mise run proxy:deploy:tinygo), deployed as
# grok-oauth-proxy-tinygo. It serves 501 on /mcp; see .plan/done/tinygo.md. Its
# main lives under build/tinygo, which is how `dev build` knows to use TinyGo.
# kv_namespaces is not inherited by environments, so it is repeated. Being a
# separate Worker, it is provisioned its own namespace: its Grok login is its own.
[env.tinygo]
main = "build/tinygo/worker.mjs"
kv_namespaces = [
  { binding = "GROK_AUTH" },
]

[env.tinygo.build]
command = "mise run proxy:wasm --env tinygo"
