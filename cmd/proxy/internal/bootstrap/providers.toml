# Providers this proxy serves. Clients pick one with a prefix on the model name,
# e.g. "xai/grok-4.3" or "groq/llama-3.3-70b-versatile". A model without a prefix
# goes to `default`.
#
# Only secret NAMES go here, never values. Set a value with
#   mise run secrets:set <provider>
# then check everything with `mise run status` and ship with `mise run deploy`.
#
# Per provider:
#   base_url  OpenAI-compatible base URL, including the version path
#   key       secret name holding the API key            (auth = "key", the default)
#   auth      "xai-oauth" for a SuperGrok login           (then: mise run login)
#             "none" for servers without auth, e.g. Ollama
#   headers   extra headers sent on every request

default = "xai"

[providers.xai]
base_url = "https://api.x.ai/v1"
key = "XAI_API_KEY"

