[tools]
go = "1.27"
fnox = "latest"
node = "24"
# Pinned: a looser "4" lets mise keep any older 4.x already installed, and 4.97's
# local runtime rejects wrangler.toml's compatibility_date.
"npm:wrangler" = "4.131.1"
cloudflared = "latest"
# Pinned to match TINYGO_VERSION in workers-go's Makefile, which is the version its
# generated wasm_exec_tinygo.js is produced against.
tinygo = "0.42.0"
# TinyGo shells out to wasm-opt from binaryen for every wasm build, including -opt=0.
# Without this the build fails on a missing shim rather than on anything real.
"aqua:WebAssembly/binaryen" = "121"

[env]
# Base URL of the deployed Worker, consumed by the cf_auth_* / cf_verify_* tasks.
GROK_BASE_URL = "https://grok-oauth-proxy.gedw99.workers.dev"

[tasks.go_run]
run = "go run ."
description = "Run the proxy server"

[tasks.go_build]
run = "go build -o ./bin/grok-oauth-proxy ."
description = "Build the proxy binary"

[tasks.go_test]
run = "go test ./..."
description = "Run Go tests"

[tasks.go_format]
run = "gofmt -w *.go"
description = "Format Go code"

# --- Worker builds: standard Go and TinyGo, side by side ----------------------
# Each toolchain writes to its own directory, so both can exist at once and be
# run and compared. wrangler.toml's default environment uses build/go, and its
# `tinygo` environment uses build/tinygo. The TinyGo build omits /mcp (it
# returns 501), because TinyGo 0.42 cannot compile the MCP SDK under Go 1.27;
# see .plan/tinygo.md.

[tasks.go_build_worker]
run = [
  "go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=go -o build/go",
  "GOOS=js GOARCH=wasm go build -o build/go/app.wasm .",
]
description = "Build the Worker with the standard Go toolchain into build/go"

[tasks.go_build_worker_tinygo]
run = [
  "go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=tinygo -o build/tinygo",
  "tinygo build -o build/tinygo/app.wasm -target wasm -no-debug .",
]
description = "Build the Worker with TinyGo into build/tinygo (no /mcp)"

[tasks.build_workers]
depends = ["go_build_worker", "go_build_worker_tinygo"]
run = "mise run build_sizes"
description = "Build the Worker with both toolchains, then compare sizes"

# Cloudflare limits only the uncompressed bundle (64 MiB on every plan, since
# 2026-09-04); gzip is shown for reference. Size mostly matters through the
# 1-second Worker startup limit, which a larger wasm module eats into.
[tasks.build_sizes]
run = "for f in build/*/app.wasm; do printf '%-26s raw %6s KB   gzip %6s KB\\n' \"$f\" $(( $(wc -c < \"$f\") / 1024 )) $(( $(gzip -9 -c \"$f\" | wc -c) / 1024 )); done"
description = "Show the raw and gzipped size of each built Worker"

# Both run locally in workerd against the local mock upstream (mise run
# mock_upstream), so they can be exercised identically at no cost. Go listens on
# 8791 and TinyGo on 8792, so both can run at once (8787 is often taken by other
# wrangler dev sessions).
[tasks.cf_dev_go]
run = "wrangler dev --port 8791 --var UPSTREAM_BASE_URL:http://127.0.0.1:18080/v1 --var UPSTREAM_API_KEY:mock-key --var ADMIN_API_KEY:mock-admin"
description = "Run the standard Go Worker locally on :8791 against the local mock upstream"

[tasks.cf_dev_tinygo]
run = "wrangler dev --env tinygo --port 8792 --var UPSTREAM_BASE_URL:http://127.0.0.1:18080/v1 --var UPSTREAM_API_KEY:mock-key --var ADMIN_API_KEY:mock-admin"
description = "Run the TinyGo Worker locally on :8792 against the local mock upstream"

[tasks.compare_workers]
run = "./tools/compare-workers.sh"
description = "Send identical requests to both local Workers and compare status, size, and latency (RUNS=20 by default)"

# --- provider-agnostic local testing ----------------------------------------
# Proves the proxy works against any OpenAI-compatible upstream, with no xAI
# account and no cost. Start the mock, then the proxy, then call 127.0.0.1:56121.

[tasks.mock_upstream]
run = "go run ./tools/mock-upstream"
description = "Local OpenAI-compatible mock upstream on 127.0.0.1:18080 (no xAI account, no cost)"

[tasks.proxy_local_mock]
run = "UPSTREAM_BASE_URL=http://127.0.0.1:18080/v1 UPSTREAM_API_KEY=mock-key ADMIN_API_KEY=mock-admin go run ."
description = "Run the proxy against the local mock upstream in static-key mode (no OAuth needed)"

# --- Cloudflare -------------------------------------------------------------
# Credentials come from fnox (~/.config/fnox/config.toml), not from a committed
# file and not from `wrangler login` state. `fnox exec` injects
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (plus the Access client pair)
# into the child process, so every Cloudflare task below is non-interactive and
# leaves no credentials on disk.

[tasks.cf_whoami]
run = "fnox exec -- wrangler whoami"
description = "Show which Cloudflare identity fnox authenticates as"

[tasks.cf_deploy]
run = "fnox exec -- wrangler deploy"
description = "Deploy the Worker to Cloudflare (wrangler.toml [build] runs go_build_worker first)"

[tasks.cf_deploy_dry]
run = "fnox exec -- wrangler deploy --dry-run"
description = "Validate the Worker build and config without uploading"

# Deploys the proxy pointed at the deployed mock provider rather than xAI, which is
# how the provider-agnostic path gets proven through real Cloudflare
# infrastructure. Pair with `mise run e2e_mock_deploy`, and revert afterwards with
# a plain `mise run cf_deploy`.
#
# Two details that are easy to get wrong:
#   * global_fetch_strictly_public is REQUIRED to fetch another Worker on the same
#     zone via workers.dev; without it every subrequest fails with error 1042.
#   * A CLI --compatibility-flags value REPLACES the config file's list rather than
#     adding to it, so streams_enable_constructors must be repeated here. Omitting
#     it would silently break streaming.
# Neither flag is in wrangler.toml, because production talks to api.x.ai, which is
# an ordinary external host and needs no Worker-to-Worker allowance.
[tasks.cf_deploy_mock_upstream]
run = "fnox exec -- wrangler deploy --compatibility-flags streams_enable_constructors --compatibility-flags global_fetch_strictly_public --var UPSTREAM_BASE_URL:https://mock-openai-provider.gedw99.workers.dev/v1 --var UPSTREAM_API_KEY:mock-key"
description = "Deploy the proxy pointed at the mock provider (end-to-end check; revert with cf_deploy)"

[tasks.cf_kv_create]
run = "fnox exec -- wrangler kv namespace create GROK_AUTH"
description = "Create the GROK_AUTH KV namespace, then paste the id into wrangler.toml"

[tasks.cf_secret_admin_key]
run = "fnox exec -- wrangler secret put ADMIN_API_KEY"
description = "Set ADMIN_API_KEY on the deployed Worker (prompts for the value on stdin)"

# Non-interactive alternative, preferred once the key lives in fnox:
#   fnox set ADMIN_API_KEY -g     # hidden prompt, stored in fnox
#   mise run cf_secret_admin_key_sync
#
# `wrangler secret put` reads the value from stdin rather than from the
# environment, so this pipes it instead of relying on `fnox exec` alone.
[tasks.cf_secret_admin_key_sync]
run = "fnox exec -- sh -c 'printf %s \"$ADMIN_API_KEY\" | wrangler secret put ADMIN_API_KEY'"
description = "Push ADMIN_API_KEY from fnox to the Worker without prompting"

# Switches the deployed Worker from xAI OAuth to a static upstream key, which is
# how it runs on pay-as-you-go API credits instead of a SuperGrok subscription.
# Unset it (wrangler secret delete) to go back to OAuth.
[tasks.cf_secret_upstream_key]
run = "fnox exec -- wrangler secret put UPSTREAM_API_KEY"
description = "Set UPSTREAM_API_KEY on the Worker (prompts; runs on API credits instead of OAuth)"

[tasks.cf_secret_upstream_key_sync]
run = "fnox exec -- sh -c 'printf %s \"$UPSTREAM_API_KEY\" | wrangler secret put UPSTREAM_API_KEY'"
description = "Push UPSTREAM_API_KEY from fnox to the Worker without prompting"

[tasks.cf_secret_upstream_key_delete]
run = "fnox exec -- wrangler secret delete UPSTREAM_API_KEY"
description = "Remove UPSTREAM_API_KEY from the Worker, reverting it to the OAuth flow"

# --- running on API credits instead of a SuperGrok subscription ---------------
# API credits bill separately from the consumer subscription, so no monthly
# commitment is needed. Buy them and create a key in the console, validate the key
# here, then push it to the Worker with cf_secret_upstream_key_sync.

[tasks.xai_console]
run = "open https://console.x.ai"
description = "Open the xAI API console, where credits are bought and API keys created"

[tasks.xai_check_key]
run = "fnox exec -- sh -c 'curl -sS -o /dev/null -w \"HTTP %{http_code}\" -H \"Authorization: Bearer $UPSTREAM_API_KEY\" https://api.x.ai/v1/models; echo'"
description = "Check UPSTREAM_API_KEY against api.x.ai directly (200 = usable, 401 = bad key; needs fnox set UPSTREAM_API_KEY)"

[tasks.cf_tail]
run = "fnox exec -- wrangler tail"
description = "Stream live logs from the deployed Worker"

# --- xAI device-flow authentication and verification ------------------------
# These need only ADMIN_API_KEY, which fnox exports, so none of them prompt and
# the key never reaches shell history or `ps` output. GROK_BASE_URL comes from
# the [env] block at the top of this file.

[tasks.cf_auth_start]
run = "fnox exec -- sh -c 'curl -sS -X POST -H \"Authorization: Bearer $ADMIN_API_KEY\" \"$GROK_BASE_URL/admin/auth/start\"'"
description = "Start the xAI device flow; prints verificationUrl and userCode to open in a browser"

[tasks.cf_auth_status]
run = "fnox exec -- sh -c 'curl -sS -X POST -H \"Authorization: Bearer $ADMIN_API_KEY\" \"$GROK_BASE_URL/admin/auth/status\"'"
description = "Poll device-flow status once (do not poll faster than retryAfterSeconds)"

[tasks.cf_auth_wait]
run = "fnox exec -- sh -c 'while :; do o=$(curl -sS -X POST -H \"Authorization: Bearer $ADMIN_API_KEY\" \"$GROK_BASE_URL/admin/auth/status\"); echo \"$o\"; case \"$o\" in *authenticated*|*denied*|*expired*|*failed*) break;; esac; sleep 5; done'"
description = "Poll device-flow status until it reaches a terminal state"

[tasks.cf_verify_status]
run = "fnox exec -- sh -c 'curl -sS -H \"Authorization: Bearer $ADMIN_API_KEY\" \"$GROK_BASE_URL/admin/status\"'"
description = "Show proxy and stored-token status"

[tasks.cf_verify_models]
run = "fnox exec -- sh -c 'curl -sS -H \"Authorization: Bearer $ADMIN_API_KEY\" \"$GROK_BASE_URL/v1/models\"'"
description = "List models via the proxy (proves the stored xAI token actually works)"

[tasks.cf_verify_chat]
run = "fnox exec -- sh -c 'curl -sS -N -X POST -H \"Authorization: Bearer $ADMIN_API_KEY\" -H \"Content-Type: application/json\" -d @- \"$GROK_BASE_URL/v1/chat/completions\"'"
description = "Stream a chat completion; pipe the request JSON to stdin"

# --- egress test (throwaway) ------------------------------------------------
# Probe that settled the VPC question in the completed deployment plan, see
# .plan/done/cloudflare-workers-deployment.md §4.1. Safe to delete once the
# egress approach is final.

[tasks.egress_test_deploy]
dir = "egress-test"
run = "fnox exec -- wrangler deploy"
description = "Deploy the throwaway api.x.ai egress probe Worker"

[tasks.egress_test_delete]
dir = "egress-test"
run = "fnox exec -- wrangler delete"
description = "Remove the throwaway egress probe Worker"

# --- end-to-end mock provider (throwaway) -----------------------------------
# A deployed OpenAI-compatible upstream, because a Worker cannot reach a
# localhost mock. Used with cf_deploy_mock_upstream to prove streaming survives
# the full client -> proxy Worker -> upstream hop chain.

[tasks.e2e_mock_deploy]
dir = "e2e-mock-provider"
run = "fnox exec -- wrangler deploy"
description = "Deploy the throwaway OpenAI-compatible mock provider Worker"

[tasks.e2e_mock_delete]
dir = "e2e-mock-provider"
run = "fnox exec -- wrangler delete"
description = "Remove the throwaway mock provider Worker"

[tasks.publish]
run = "cd npm/ && npm publish"
description = "Publish the npm wrapper package in npm/"

[tasks.npm_publish]
run = "mise run publish"
description = "Alias for publish (kept for backwards compatibility)"
