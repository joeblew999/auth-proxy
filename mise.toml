# Everything this project does is a task below; `mise tasks` lists them.
# Providers live in providers.toml, secret values in fnox (mise run keys:set).

[tools]
go = "1.27"
node = "24"
tinygo = "0.42.0"   # must match TINYGO_VERSION in workers-go's Makefile
"aqua:WebAssembly/binaryen" = "121"   # wasm-opt, for TinyGo
# packslip: a verified manifest plus version-matched skills when the publisher
# ships them. Exact versions, so CI and every clone get the same release; mise
# refuses a fuzzy version younger than minimum_release_age (24h). `mise up`.
"packslip:github.com/jdx/fnox" = "1.35.2"
"packslip:github.com/joeblew999/gsx" = "0.1.2"
"packslip:github.com/joeblew999/gsxui" = "0.1.0"
"packslip:github.com/jdx/hk" = "2.0.1"
jq = "latest"   # .claude/hooks/skill-gate reads the tool payload with it
goreleaser = "latest"
packslip = "latest"
gh = "latest"
pitchfork = "latest"
"npm:wrangler" = "4.131.1"   # 4.97's local runtime rejects wrangler.toml's compatibility_date
"go:github.com/ardanlabs/kronk/cmd/kronk" = "1.32.6"   # local models on 127.0.0.1:11435
"go:github.com/oligot/go-mod-upgrade" = "latest"   # mise run deps:list
# cmd/gui builds with its own go.mod tool pin (go tool gsx, upstream gsxhq/gsx
# v0.1.1), not the packslip gsx above, whose 0.1.2 is that code plus release
# wiring. Nothing checks they stay the same; see .plan/local-and-browser-ai.md.

[hooks]
postinstall = { task = "dev:bootstrap" }

# Packslip skills link into .claude/skills next to the vendored copies from
# session.toml; mise keeps real directories, so the two never fight.
[settings.skills]
auto_sync = true
prune = true

# mise waits 24h before installing a release, and for packslip refuses to
# bypass that even for a pin, so someone else's bad release gets noticed first.
# For the owner's own forks there is no one else. hk and fnox keep the wait.
[settings]
minimum_release_age_excludes = ["packslip:github.com/joeblew999/gsx", "packslip:github.com/joeblew999/gsxui"]

# --- tasks ---------------------------------------------------------------------
# A task is a line: what runs, what it needs, and for a build the sources and
# outputs that let mise skip it. Anything with a branch, loop, parse or API
# call is a subcommand of bin/dev (cmd/dev), with a test. Two halves: the
# stack, which any repo on it has, and this project. Multi-line ones at the end.

[vars]
app = "grok-oauth-proxy"   # the one place the project is named: binary, Worker, skill
worker = "cmd/worker"      # a Worker owns its wrangler.toml and its build/; this is the proxy's

[tasks]
# --- the stack -----------------------------------------------------------------
lint = { description = "hk checks: gofmt, vet, tidy, whitespace, secrets", run = "hk check --all" }
"build:dev" = { hide = true, sources = ["cmd/dev/**", "go.mod", "go.sum"], outputs = ["bin/dev"], run = "go build -o bin/dev ./cmd/dev" }
"dev:bootstrap" = { description = "wire a fresh clone: skills, settings, git hooks (runs after mise install)", depends = ["dev:session:sync"], run = ["mise skills sync", "hk install"] }
"dev:session:sync" = { description = "write .claude/skills and the settings.json keys from session.toml", depends = ["build:dev"], run = "bin/dev session sync" }
"dev:session:check" = { hide = true, depends = ["build:dev"], run = "bin/dev session check" }
"dev:session:verify" = { description = "hold a fresh Claude Code session against SESSION.lock (pre-push; --update re-records)", depends = ["build:dev"], usage = 'flag "--update"', run = "bin/dev session verify --update=$usage_update" }
"dev:session:bump" = { description = "move github pins in session.toml to upstream HEAD", depends = ["build:dev"], raw = true, usage = 'arg "[source]"', run = "bin/dev session bump $usage_source" }
"dev:hooks:check" = { description = "prove the Claude Code skill hook fires on every write and no read", run = ".claude/hooks/skill-gate.test" }
"dev:mcp" = { description = "every MCP server .mcp.json declares connects", depends = ["build:dev"], run = "bin/dev mcp check" }
"deps:list" = { description = "Go module upgrades available, in every module", depends = ["build:dev"], run = "bin/dev deps list" }
"deps:upgrade" = { description = "upgrade Go modules interactively, in every module", depends = ["build:dev"], raw = true, run = ["bin/dev deps upgrade", "mise run dev:session:check"] }
url = { description = "this clone's deployed Worker URL (--env tinygo; --refresh after switching accounts)", depends = ["build:dev"], quiet = true, usage = 'flag "--env <name>" default=""; flag "--refresh"', run = 'bin/dev url --worker --dir {{vars.worker}} --env="$usage_env" --refresh=$usage_refresh' }
logs = { description = "live logs from the deployed Worker", dir = "cmd/worker", run = 'fnox exec -- wrangler tail --env ""' }
"keys:set" = { description = "store a provider's key in fnox and push it to the Worker (admin: the client key)", depends = ["build:cli", "build:dev"], raw = true, usage = 'arg "<provider>"; flag "--generate"', run = 'bin/dev worker keys set --dir {{vars.worker}} --generate=$usage_generate "$(bin/{{vars.app}} keys "$usage_provider")"' }
"keys:push" = { description = "push every secret providers.toml needs, naming any missing (--env tinygo)", depends = ["build:cli", "build:dev"], usage = 'flag "--env <name>" default=""', run = 'bin/{{vars.app}} keys | bin/dev worker keys push --dir {{vars.worker}} --env="$usage_env"' }
"svc:start" = { description = "start a daemon under pitchfork: proxy, or proxy-mock with the mock upstream", depends = ["build:cli", "build:mock"], raw = true, usage = 'arg "[daemon]" default="proxy"', run = 'pitchfork start "$usage_daemon"' }
"svc:stop" = { description = "stop everything this project started", run = "pitchfork stop proxy proxy-mock mock" }
"svc:status" = { description = "what this project has running", run = "pitchfork list --project" }
"svc:logs" = { description = "tail a daemon's logs", raw = true, usage = 'arg "[daemon]" default="proxy"', run = 'pitchfork logs "$usage_daemon" --tail' }
release = { description = "publish a GitHub Release fully locally: tag, build, sign, upload", raw = true, usage = 'arg "<version>"', run = 'mise run release:publish "$usage_version"' }
"release:snapshot" = { description = "build release artifacts locally, publish nothing", depends = ["build:dev"], run = "bin/dev release snapshot" }
"release:packslip" = { description = "build and verify the packslip manifest for the snapshot", depends = ["build:dev"], run = "bin/dev release packslip --bin {{vars.app}} --resource skill/{{vars.app}}=repo:skills/{{vars.app}}" }
"release:publish" = { description = "build, sign, publish (CI signs with its identity; locally --key and gh)", depends = ["build:dev"], raw = true, usage = 'arg "[version]"', run = 'bin/dev release publish --bin {{vars.app}} --resource skill/{{vars.app}}=repo:skills/{{vars.app}} --version "$usage_version"' }

# --- this project: the proxy, its two Worker builds, the mock, the GUI spike ------
build = { description = "the local binary and the Go Worker", depends = ["build:cli", "build:worker"] }
"build:tinygo" = { description = "both Workers, with sizes", depends = ["build", "build:worker-tinygo", "build:dev"], run = "bin/dev sizes {{vars.worker}}/build/go/app.wasm {{vars.worker}}/build/tinygo/app.wasm" }
"build:bench" = { hide = true, sources = ["cmd/bench/**", "cmd/dev/sizes/**", "go.mod", "go.sum"], outputs = ["bin/bench"], run = "go build -o bin/bench ./cmd/bench" }
dev = { description = "the proxy on http://127.0.0.1:56121/v1 with real providers (pitchfork's proxy daemon)", depends = ["build:cli"], raw = true, run = "fnox exec -- bin/{{vars.app}} serve" }
"dev:mock" = { description = "the proxy against the mock, no real keys (the mock: svc:start proxy-mock, or dev:mock-server)", depends = ["build:cli"], raw = true, env = { MOCK_API_KEY = "mock-key" }, run = "fnox exec -- bin/{{vars.app}} serve --config cmd/mock-upstream/providers.toml" }
"dev:mock-server" = { description = "the mock upstream on 127.0.0.1:18080 (pitchfork's mock daemon)", depends = ["build:mock"], raw = true, run = "bin/mock-upstream -addr 127.0.0.1:18080" }
status = { description = "every provider's readiness and the fix for each problem (--worker: the deployed Worker)", depends = ["build:cli", "build:dev"], usage = 'flag "--worker"', run = 'fnox exec -- bin/{{vars.app}} status --url "$(bin/dev url --worker=$usage_worker --dir {{vars.worker}})"' }
models = { description = "model IDs across all providers (--worker; otherwise needs mise run dev)", depends = ["build:cli", "build:dev"], usage = 'flag "--worker"', run = 'fnox exec -- bin/{{vars.app}} models --url "$(bin/dev url --worker=$usage_worker --dir {{vars.worker}} --local http://127.0.0.1:56121)"' }
chat = { description = "send a prompt to a model and stream the answer (--worker)", depends = ["build:cli", "build:dev"], usage = 'arg "<model>"; arg "[prompt]" default="Say hello in one sentence."; flag "--worker"', run = 'fnox exec -- bin/{{vars.app}} chat --url "$(bin/dev url --worker=$usage_worker --dir {{vars.worker}} --local http://127.0.0.1:56121)" "$usage_model" "$usage_prompt"' }
login = { description = "log in to a SuperGrok subscription for auth = \"xai-oauth\" providers (--worker: device code)", depends = ["build:cli", "build:dev"], raw = true, usage = 'flag "--worker"', run = 'fnox exec -- bin/{{vars.app}} login --url "$(bin/dev url --worker=$usage_worker --dir {{vars.worker}})"' }
bench = { description = "Go vs TinyGo Worker in local workerd against the mock (RUNS=n)", depends = ["build:mock", "build:bench"], run = "bin/bench" }
"dev:browser" = { description = "drive an app in a headless Chrome and run its probe (defaults: the GUI spike)", depends = ["gui:build", "build:dev"], usage = 'arg "[server]" default="cmd/gui/bin/gui"; arg "[probe]" default="cmd/gui/tools/browser-check.mjs"; arg "[path]" default="/?mode=remote"', run = 'bin/dev browser "$usage_server" "$usage_probe" "$usage_path"' }
"gui:dev" = { description = "gsx dev loop for cmd/gui with live reload on http://localhost:5173", dir = "cmd/gui", depends = ["gui:install"], raw = true, run = "npm run dev" }
"gui:serve" = { description = "run cmd/gui natively on http://localhost:7777", dir = "cmd/gui", depends = ["gui:build"], raw = true, run = "bin/gui" }
"gui:workerd" = { description = "run the GUI Worker locally in workerd (wrangler dev)", dir = "cmd/gui", depends = ["gui:build:worker"], raw = true, run = 'wrangler dev --env ""' }
"gui:smoke" = { description = "the GUI on local workerd: one page requested and checked", depends = ["gui:build:worker", "build:dev"], run = "bin/dev worker smoke --dir cmd/gui --path /?mode=remote --expect 'Pick a model'" }
"gui:deploy" = { description = "deploy the GUI Worker (grok-oauth-proxy-gui) and wait for its page", depends = ["gui:build:worker", "build:dev"], run = ["bin/dev worker deploy --dir cmd/gui", 'bin/dev worker wait "$(bin/dev url --worker --dir cmd/gui)/healthz"'] }
"gui:url" = { description = "the GUI Worker's URL", depends = ["build:dev"], quiet = true, run = "bin/dev url --worker --dir cmd/gui" }

# --- multi-line: run lists and the builds mise skips when up to date -------------
[tasks.test]
description = "lint, wasm vet, all tests, the session and hook checks, the GUI spike"
run = ["mise run lint", "GOOS=js GOARCH=wasm go vet ./...", "go test ./...", "mise run dev:session:check", "mise run dev:hooks:check", "mise run gui:check"]

[tasks.setup]
description = "one-time: Worker URL, client key if missing, every key pushed, what is still missing"
depends = ["build:cli", "build:dev"]
run = ["bin/dev url --worker --dir {{vars.worker}}", 'bin/dev worker keys set --dir {{vars.worker}} --generate --if-missing "$(bin/{{vars.app}} keys admin)"', "mise run keys:push", "mise run status --worker"]

# wrangler writes provisioned ids back into the config it deploys from, so
# `dev worker deploy` runs it on a throwaway copy of wrangler.toml.
[tasks.deploy]
description = "validate providers.toml, build, deploy the Worker"
depends = ["build:cli", "build:dev"]
run = ["bin/{{vars.app}} keys >/dev/null", "bin/dev worker deploy --dir {{vars.worker}}", "echo 'Deployed. Check it with: mise run status --worker'"]

[tasks."deploy:tinygo"]
description = "deploy the TinyGo build as the -tinygo Worker (no /mcp), push its keys, wait, check"
depends = ["build:cli", "build:dev"]
run = [
  "bin/{{vars.app}} keys >/dev/null",
  "bin/dev worker deploy --dir {{vars.worker}} --env tinygo",
  "bin/{{vars.app}} keys | bin/dev worker keys push --dir {{vars.worker}} --env tinygo",
  'bin/dev worker wait "$(bin/dev url --worker --dir {{vars.worker}} --env tinygo)/health"',
  'fnox exec -- bin/{{vars.app}} status --url "$(bin/dev url --worker --dir {{vars.worker}} --env tinygo)"',
]

[tasks."build:cli"]
hide = true
sources = ["cmd/server/**", "internal/**", "go.mod", "go.sum"]
outputs = ["bin/{{vars.app}}"]
run = "go build -o bin/{{vars.app}} ./cmd/server"

[tasks."build:mock"]
hide = true
sources = ["cmd/mock-upstream/**", "go.mod", "go.sum"]
outputs = ["bin/mock-upstream"]
run = "go build -o bin/mock-upstream ./cmd/mock-upstream"

[tasks."build:worker"]   # cmd/worker/wrangler.toml [build] calls this by name
hide = true
sources = ["{{vars.worker}}/*.go", "internal/**", "go.mod", "go.sum"]
outputs = ["{{vars.worker}}/build/go/app.wasm", "{{vars.worker}}/build/go/worker.mjs"]
run = ["go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=go -o {{vars.worker}}/build/go", "GOOS=js GOARCH=wasm go build -o {{vars.worker}}/build/go/app.wasm ./{{vars.worker}}"]

[tasks."build:worker-tinygo"]
hide = true
sources = ["{{vars.worker}}/*.go", "internal/**", "go.mod", "go.sum"]
outputs = ["{{vars.worker}}/build/tinygo/app.wasm", "{{vars.worker}}/build/tinygo/worker.mjs"]
run = ["go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=tinygo -o {{vars.worker}}/build/tinygo", "tinygo build -o {{vars.worker}}/build/tinygo/app.wasm -target wasm -no-debug ./{{vars.worker}}"]

# cmd/gui, scaffolded the way gsx documents (gsx init --yes, gsxui init). vite
# build empties dist/ and the Go binary embeds it, so npm builds first.
[tasks."gui:install"]
hide = true
dir = "cmd/gui"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks."gui:build"]
description = "build cmd/gui the gsx way: vite build, gsx generate, go build"
dir = "cmd/gui"
depends = ["gui:install"]
sources = ["**/*.gsx", "**/*.go", "web/**", "package.json", "vite.config.ts", "gsxui.json", "go.mod"]
outputs = ["bin/gui"]
run = ["npm run build", "go tool gsx generate -q", "go build -o bin/gui ."]

[tasks."gui:build:worker"]   # cmd/gui/wrangler.toml [build] calls this by name
hide = true
dir = "cmd/gui"
depends = ["gui:build"]
sources = ["**/*.go", "dist/**", "public/**", "go.mod", "go.sum"]
outputs = ["build/go/app.wasm", "build/go/worker.mjs"]
run = ["go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=go -o build/go", "GOOS=js GOARCH=wasm go build -o build/go/app.wasm ."]

[tasks."gui:check"]
description = "cmd/gui: gsx formatting, vet, tests, a TinyGo wasm build, the browser round trip, the workerd round trip"
dir = "cmd/gui"
depends = ["gui:build"]
run = [
  "go tool gsx fmt -l . || (echo 'unformatted .gsx above; fix with: go tool gsx fmt -w .' && false)",
  "go vet ./...",
  "go test ./...",
  "tinygo build -o /dev/null -target wasm ./cmd/tinygo-render",
  "mise run dev:browser",
  "mise run gui:smoke",
]
