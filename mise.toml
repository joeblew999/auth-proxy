# Everything this project does is a task below; `mise tasks` lists them.
# Providers live in providers.toml. Secret values live in fnox and are pushed to
# the Worker by the keys:* tasks, so nothing else needs remembering.

# Runtimes.
[tools]
go = "1.27"
node = "24"
tinygo = "0.42.0"   # must match TINYGO_VERSION in workers-go's Makefile
"aqua:WebAssembly/binaryen" = "121"   # TinyGo shells out to wasm-opt

# Secrets, releases, services, hooks. packslip: means a verified manifest plus
# version-matched skills when the publisher ships them.
"packslip:github.com/jdx/fnox" = "latest"
"packslip:github.com/joeblew999/gsx" = "latest"
"packslip:github.com/joeblew999/gsxui" = "latest"
"packslip:github.com/jdx/hk" = "latest"

goreleaser = "latest"
packslip = "latest"
gh = "latest"
pitchfork = "latest"

# Cloudflare. A looser "4" lets mise keep any older 4.x already installed, and
# 4.97's local runtime rejects wrangler.toml's compatibility_date.
"npm:wrangler" = "4.131.1"

# Go tools. Inside spikes/hello-world, builds use go.mod's tool pin
# (go tool gsx); the fork tracks upstream, so the versions agree.
"go:github.com/ardanlabs/kronk/cmd/kronk" = "1.32.6"   # local models on 127.0.0.1:11435
"go:github.com/oligot/go-mod-upgrade" = "latest"   # see: mise run deps:list

[hooks]
postinstall = { task = "dev:skills:sync" }

# Packslip skills link into .claude/skills alongside the vendored copies from
# skills.toml. mise preserves real directories, so the two never fight. When a
# tool ships its skill, delete its source from skills.toml and let mise own it.
[settings.skills]
auto_sync = true
prune = true

[env]
# The deployed Worker; every --worker flag talks to it.
PROXY_URL = "https://grok-oauth-proxy.gedw99.workers.dev"
# The TinyGo build, deployed by `mise run deploy --tinygo`.
PROXY_URL_TINYGO = "https://grok-oauth-proxy-tinygo.gedw99.workers.dev"

# --- tasks live in mise-tasks/ as files, one per task --------------------------
# Groups become directories: dev/*, dev/skills/*, svc/*, hello/*, keys/*,
# deps/*, release/*. Top-level scripts (status, models, chat, login, build,
# deploy, logs, setup, bench, lint) sit at the root. Only `test` and the
# hidden build:* helpers stay here: wrangler.toml [build] calls
# `mise run build:worker` by name, and test is the front door.

# --- build and deploy ----------------------------------------------------------

[tasks.test]
description = "Check formatting, vet the local and Worker builds, and run all tests"
run = [
  "mise run lint",
  "GOOS=js GOARCH=wasm go vet ./...",
  "go test ./...",
  "mise run dev:skills:check",
  "mise run hello:check",
]

# --- deps: go.mod follows the mise pins, never the reverse -----------------------
# Bump the version in [tools] first, then run these so each go.mod follows.
# File tasks in mise-tasks/deps/.

# --- bin/dev: this repo's own tooling, one task per `dev <group> <verb>` -------
# File tasks in mise-tasks/dev/ (skills/*, browser).

# --- spikes/hello-world: gsx + gsxui, used exactly as gsx documents ------------
# Scaffolded with `gsx init --yes` (Vite starter) and `gsxui init` (Vite mode).
# Order matters: `vite build` empties dist/, and the Go binary embeds dist/, so
# the npm build must run before any Go build or vet. File tasks in
# mise-tasks/hello/.

# --- release: versioned CLI artifacts plus a packslip manifest -----------------
# File tasks in mise-tasks/release/ (`mise run release v1.2.0` publishes fully
# locally: goreleaser + key-signed packslip + gh upload).
# .github/workflows/release.yml runs release:publish on a tag push as the CI backup.

# --- used by wrangler.toml [build]; not for direct use -------------------------

[tasks."build:worker"]
hide = true
run = [
  "go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=go -o build/go",
  "GOOS=js GOARCH=wasm go build -o build/go/app.wasm .",
]

[tasks."build:worker-tinygo"]
hide = true
run = [
  "go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=tinygo -o build/tinygo",
  "tinygo build -o build/tinygo/app.wasm -target wasm -no-debug .",
]

[tasks."build:cli"]
hide = true
run = "go build -o bin/grok-oauth-proxy ."

[tasks."build:dev"]
hide = true
run = "go build -o bin/dev ./cmd/dev"
