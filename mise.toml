# Everything this project does is a task below; `mise tasks` lists them.
# Providers live in providers.toml, secret values in fnox (mise run secrets:set).

[tools]
go = "1.27"
node = "24"
tinygo = "0.42.0"   # must match TINYGO_VERSION in workers-go's Makefile
"aqua:WebAssembly/binaryen" = "121"   # wasm-opt, for TinyGo
# packslip: a verified manifest plus version-matched skills when the publisher
# ships them. Exact versions, so CI and every clone get the same release; mise
# refuses a fuzzy version younger than minimum_release_age (24h). `mise up`.
"packslip:github.com/jdx/fnox" = "1.35.2"
"packslip:github.com/joeblew999/gsx" = "0.1.2"
"packslip:github.com/joeblew999/gsxui" = "0.1.0"
"packslip:github.com/jdx/hk" = "2.0.1"
jq = "latest"   # .claude/hooks/skill-gate reads the tool payload with it
goreleaser = "latest"
packslip = "latest"
gh = "latest"
pitchfork = "latest"
"npm:wrangler" = "4.131.1"   # 4.97's local runtime rejects wrangler.toml's compatibility_date
"go:github.com/ardanlabs/kronk/cmd/kronk" = "1.32.6"   # local models on 127.0.0.1:11435
"go:github.com/oligot/go-mod-upgrade" = "latest"   # mise run deps:list
# cmd/gui builds with its own go.mod tool pin (go tool gsx, upstream gsxhq/gsx
# v0.1.1), not the packslip gsx above, whose 0.1.2 is that code plus release
# wiring. Nothing checks they stay the same; see .plan/local-and-browser-ai.md.

[hooks]
postinstall = { task = "bootstrap" }

# Packslip skills link into .claude/skills next to the vendored copies from
# session.toml; mise keeps real directories, so the two never fight.
[settings.skills]
auto_sync = true
prune = true

# mise waits 24h before installing a release, and for packslip refuses to
# bypass that even for a pin, so someone else's bad release gets noticed first.
# For the owner's own forks there is no one else. hk and fnox keep the wait.
[settings]
minimum_release_age_excludes = [
  "packslip:github.com/joeblew999/gsx",
  "packslip:github.com/joeblew999/gsxui",
]

# ------------------------------------------------------------------------------
# Tasks. `<cmd>:<stage>[:variant]`, or a stack verb; the short names the README
# uses are aliases. `bin/dev <stage> <dir>` reads the
# directory (Go main, package.json, .gsx, wrangler.toml) and does the rest.
# Anything typed after a task name goes to the command, so flags need no
# declaring: `mise run proxy:build --env tinygo`, `mise run secrets:set admin
# --generate`. The stack half names nothing of this project; it reaches the
# project through [vars] and three tasks the project supplies: `check` (what
# test runs), `validate` (what deploy runs first) and `secrets` (NAME<TAB>OWNER
# lines for keys:*).
# ------------------------------------------------------------------------------

[vars]
app = "grok-oauth-proxy"   # the released binary and the skill
worker = "cmd/proxy"       # the Worker whose secrets keys:* manage

# ==============================================================================
# The stack
# ==============================================================================

[tasks.lint]
description = "hk checks: gofmt, vet, tidy, whitespace, secrets"
run = "hk check --all"

[tasks.test]
description = "lint, the session and hook checks, then the project's own check"
run = [
  "mise run lint",
  "mise run session:check",
  "mise run hooks:check",
  "mise run check",
]

[tasks."dev:build"]
hide = true
dir = "cmd/dev"
sources = ["**/*.go", "go.mod"]
outputs = ["../../bin/dev"]
run = "go build -o ../../bin/dev ."

[tasks.bootstrap]
description = "wire a fresh clone: skills, settings, git hooks (runs after mise install)"
depends = ["session:sync"]
run = [
  "mise skills sync",
  "hk install",
]

[tasks."session:sync"]
description = "write .claude/skills and the settings.json keys from session.toml"
depends = ["dev:build"]
run = "bin/dev session sync"

[tasks."session:check"]
hide = true
depends = ["dev:build"]
run = "bin/dev session check"

[tasks."session:verify"]
description = "hold a fresh Claude Code session against SESSION.lock (pre-push; --update re-records)"
depends = ["dev:build"]
run = "bin/dev session verify"

[tasks."session:bump"]
description = "move github pins in session.toml to upstream HEAD (one source, or all)"
depends = ["dev:build"]
raw = true
run = "bin/dev session bump"

[tasks."hooks:check"]
description = "prove the Claude Code skill hook fires on every write and no read"
run = ".claude/hooks/skill-gate.test"

[tasks."mcp:check"]
description = "every MCP server .mcp.json declares connects"
depends = ["dev:build"]
run = "bin/dev mcp check"

[tasks."dev:check"]
description = "vet and test the dev tool itself"
depends = ["dev:build"]
run = "bin/dev check cmd/dev"

[tasks.browser]
description = "serve an app, drive it in a headless Chrome, run a probe: <server> <probe> [path]"
depends = ["dev:build"]
run = "bin/dev browser"

[tasks."deps:list"]
description = "Go module upgrades available, in every module"
depends = ["dev:build"]
run = "bin/dev deps list"

[tasks."deps:upgrade"]
description = "upgrade Go modules interactively, in every module"
depends = ["dev:build"]
raw = true
run = [
  "bin/dev deps upgrade",
  "mise run session:check",
]

[tasks."secrets:set"]
description = "store a secret in fnox and push it: <name|provider|admin> [--generate] [--if-missing]"
depends = ["dev:build"]
raw = true
run = 'bin/dev secrets set {{vars.worker}} --names "$(mise run secrets:list)"'

[tasks."secrets:push"]
description = "push every secret the project needs from fnox, naming any missing [--env tinygo]"
depends = ["dev:build"]
run = "mise run secrets:list | bin/dev secrets push {{vars.worker}}"

[tasks."svc:start"]
description = "start a daemon from pitchfork.toml, so nothing blocks a terminal: <daemon>"
raw = true
run = "pitchfork start"

[tasks."svc:stop"]
description = "stop every daemon this project started"
run = "pitchfork stop --local"

[tasks."svc:status"]
description = "what this project has running"
run = "pitchfork list --project"

[tasks."svc:logs"]
description = "tail a daemon's logs: <daemon>"
raw = true
run = "pitchfork logs --tail"

[tasks.release]
description = "publish a GitHub Release fully locally: <version>"
raw = true
run = "mise run release:publish --version"

[tasks."release:snapshot"]
description = "build release artifacts locally, publish nothing"
depends = ["dev:build"]
run = "bin/dev release snapshot"

[tasks."release:packslip"]
description = "build and verify the packslip manifest for the snapshot"
depends = ["dev:build"]
run = "bin/dev release packslip --bin {{vars.app}} --resource skill/{{vars.app}}=repo:skills/{{vars.app}}"

[tasks."release:publish"]
description = "build, sign, publish (CI signs with its identity; locally --key and gh) [--version v1.2.0]"
depends = ["dev:build"]
raw = true
run = "bin/dev release publish --bin {{vars.app}} --resource skill/{{vars.app}}=repo:skills/{{vars.app}}"

# ==============================================================================
# This project: four commands, the same stages for each
# ==============================================================================

# --- cmd/proxy: the proxy, a CLI natively and a Worker on Cloudflare -------------

[tasks."proxy:build"]
description = "bin/proxy"
depends = ["dev:build"]
sources = ["cmd/proxy/**/*.go", "cmd/proxy/**/*.toml", "cmd/proxy/go.mod"]
outputs = ["bin/proxy"]
run = "bin/dev build cmd/proxy"

[tasks."proxy:wasm"]
description = "the proxy Worker's wasm [--env tinygo]; wrangler runs this before dev and deploy"
depends = ["dev:build"]
run = "bin/dev wasm cmd/proxy"

[tasks."proxy:run"]
alias = "dev"
description = "the proxy on http://127.0.0.1:56121/v1 with real providers (pitchfork's proxy daemon)"
depends = ["proxy:build"]
raw = true
run = "bin/dev run cmd/proxy -- serve"

[tasks."proxy:run:mock"]
description = "the proxy against the mock, no real keys (the mock: mise run svc:start proxy-mock)"
depends = ["proxy:build"]
raw = true
env = { MOCK_API_KEY = "mock-key" }
run = "bin/dev run cmd/proxy -- serve --config cmd/mock-upstream/providers.toml"

[tasks."proxy:workerd"]
description = "the proxy Worker on local workerd (wrangler dev)"
depends = ["dev:build"]
raw = true
run = "bin/dev workerd cmd/proxy"

[tasks."proxy:check"]
description = "vet native and wasm, test, and prove the Worker answers on local workerd"
depends = ["dev:build"]
run = "bin/dev check cmd/proxy --path /health"

[tasks."proxy:deploy"]
alias = "deploy"
description = "validate providers.toml, then deploy the proxy Worker"
depends = ["validate", "dev:build"]
run = "bin/dev deploy cmd/proxy"

[tasks."proxy:deploy:tinygo"]
description = "deploy the TinyGo build as the -tinygo Worker (no /mcp), push its keys, wait"
depends = ["validate", "dev:build"]
run = [
  "bin/dev deploy cmd/proxy --env tinygo --wait /health",
  "mise run secrets:push --env tinygo",
]

[tasks."proxy:url"]
alias = "url"
description = "this clone's proxy Worker URL [--env tinygo] [--refresh, after switching accounts]"
depends = ["dev:build"]
quiet = true
run = "bin/dev url cmd/proxy --worker"

[tasks."proxy:logs"]
alias = "logs"
description = "live logs from the deployed proxy Worker"
depends = ["dev:build"]
raw = true
run = "bin/dev logs cmd/proxy"

# The proxy CLI: against the local proxy, and (proxy:*) against the deployed Worker.

[tasks."proxy:status"]
alias = "status"
description = "every provider's readiness and the fix for each problem"
depends = ["proxy:build"]
run = "bin/dev run cmd/proxy -- status"

[tasks."proxy:models"]
alias = "models"
description = "model IDs across all providers, from the local proxy (mise run dev)"
depends = ["proxy:build"]
run = "bin/dev run cmd/proxy -- models"

[tasks."proxy:chat"]
alias = "chat"
description = "send a prompt through the local proxy and stream the answer: <model> [prompt]"
depends = ["proxy:build"]
run = "bin/dev run cmd/proxy -- chat"

[tasks."proxy:login"]
alias = "login"
description = "log in to a SuperGrok subscription for auth = \"xai-oauth\" providers"
depends = ["proxy:build"]
raw = true
run = "bin/dev run cmd/proxy -- login"

[tasks."proxy:status:worker"]
description = "every provider's readiness on the deployed Worker"
depends = ["proxy:build"]
run = 'bin/dev run cmd/proxy -- status --url "$(bin/dev url cmd/proxy --worker)"'

[tasks."proxy:models:worker"]
description = "model IDs from the deployed Worker"
depends = ["proxy:build"]
run = 'bin/dev run cmd/proxy -- models --url "$(bin/dev url cmd/proxy --worker)"'

[tasks."proxy:chat:worker"]
description = "send a prompt through the deployed Worker: <model> [prompt]"
depends = ["proxy:build"]
run = 'bin/dev run cmd/proxy -- chat --url "$(bin/dev url cmd/proxy --worker)"'

[tasks."proxy:login:worker"]
description = "log the deployed Worker in with a device code"
depends = ["proxy:build"]
raw = true
run = 'bin/dev run cmd/proxy -- login --url "$(bin/dev url cmd/proxy --worker)"'

# --- cmd/gui: the GUI, a native server and a Worker from one handler (gsx, gsxui, Vite)

[tasks."gui:build"]
description = "npm ci when stale, vite build, gsx generate, bin/gui"
depends = ["dev:build"]
sources = ["cmd/gui/*.go", "cmd/gui/*.gsx", "cmd/gui/views/**", "cmd/gui/ui/**", "cmd/gui/web/**", "cmd/gui/public/**", "cmd/gui/package.json", "cmd/gui/vite.config.ts", "cmd/gui/go.mod"]
outputs = ["bin/gui"]
run = "bin/dev build cmd/gui"

[tasks."gui:wasm"]
description = "the GUI Worker's wasm; wrangler runs this before dev and deploy"
depends = ["gui:build"]
run = "bin/dev wasm cmd/gui"

[tasks."gui:run:dev"]
description = "gsx dev loop with live reload on http://localhost:5173"
dir = "cmd/gui"
depends = ["gui:build"]
raw = true
run = "npm run dev"

[tasks."gui:run"]
description = "the GUI natively on http://localhost:7777"
depends = ["gui:build"]
raw = true
run = "bin/dev run cmd/gui"

[tasks."gui:workerd"]
description = "the GUI Worker on local workerd (wrangler dev)"
depends = ["dev:build"]
raw = true
run = "bin/dev workerd cmd/gui"

[tasks."gui:check"]
description = "gsx formatting, vet native and wasm, tests, the workerd round trip, the browser probe"
depends = ["gui:build"]
run = "bin/dev check cmd/gui --path '/?mode=remote' --expect 'Pick a model'"

[tasks."gui:check:tinygo"]
description = "the GUI's components compile under TinyGo, which the Service Worker topology needs"
dir = "cmd/gui"
run = "tinygo build -o /dev/null -target wasm ./cmd/tinygo-render"

[tasks."gui:deploy"]
description = "deploy the GUI Worker (grok-oauth-proxy-gui) and wait for its page"
depends = ["dev:build"]
run = "bin/dev deploy cmd/gui --wait /healthz"

[tasks."gui:url"]
description = "this clone's GUI Worker URL"
depends = ["dev:build"]
quiet = true
run = "bin/dev url cmd/gui --worker"

[tasks."gui:logs"]
description = "live logs from the deployed GUI Worker"
depends = ["dev:build"]
raw = true
run = "bin/dev logs cmd/gui"

# --- cmd/mock-upstream: an OpenAI-compatible mock; cmd/bench: Go vs TinyGo in workerd

[tasks."mock:build"]
description = "bin/mock-upstream"
depends = ["dev:build"]
sources = ["cmd/mock-upstream/**"]
outputs = ["bin/mock-upstream"]
run = "bin/dev build cmd/mock-upstream"

[tasks."mock:check"]
description = "vet and test the mock"
depends = ["dev:build"]
run = "bin/dev check cmd/mock-upstream"

[tasks."mock:run"]
description = "the mock upstream on 127.0.0.1:18080 (pitchfork's mock daemon)"
depends = ["mock:build"]
raw = true
run = "bin/dev run cmd/mock-upstream -- -addr 127.0.0.1:18080"

[tasks."bench:build"]
description = "bin/bench"
depends = ["dev:build"]
sources = ["cmd/bench/**", "cmd/dev/**"]
outputs = ["bin/bench"]
run = "bin/dev build cmd/bench"

[tasks."bench:check"]
description = "vet and test the bench"
depends = ["dev:build"]
run = "bin/dev check cmd/bench"

[tasks."bench:run"]
alias = "bench"
description = "Go vs TinyGo proxy Worker in local workerd against the mock (RUNS=n)"
depends = ["mock:build", "bench:build"]
run = "bin/dev run cmd/bench"

# --- the whole project, and what the stack asks of it ------------------------------

[tasks.build]
description = "every command, binaries and wasm"
depends = ["proxy:build", "proxy:wasm", "gui:build", "gui:wasm", "mock:build", "bench:build"]

[tasks.check]
description = "what test runs here: every command's check"
run = [
  "mise run dev:check",
  "mise run proxy:check",
  "mise run gui:check",
  "mise run gui:check:tinygo",
  "mise run mock:check",
  "mise run bench:check",
]

[tasks.validate]
hide = true
depends = ["proxy:build"]
run = "bin/proxy validate"

[tasks."secrets:list"]
hide = true
quiet = true
depends = ["proxy:build"]
run = "bin/proxy secrets"

[tasks.setup]
description = "one-time: Worker URL, client key if missing, every key pushed, what is still missing"
depends = ["dev:build"]
run = [
  "bin/dev url cmd/proxy --worker",
  "mise run secrets:set admin --generate --if-missing",
  "mise run secrets:push",
  "mise run proxy:status:worker",
]
